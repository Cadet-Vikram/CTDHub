model:
  backbone: resnet50
  embedding_size: 512
  pretrained: true

arcface_loss:
  scale: 64.0
  margin: 0.5

training:
  epochs: 50
  batch_size: 32
  num_workers: 4
  learning_rate: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4
  lr_milestones: [20, 35, 45]
  lr_gamma: 0.1
  mixed_precision: true

data:
  train_dir: ./data/aligned/train
  val_dir:   ./data/aligned/val
  img_size: 112
  augment: true

output:
  checkpoint_dir: ./checkpoints/arcface
  save_every_n_epochs: 5
  log_file: ./checkpoints/arcface/train.log

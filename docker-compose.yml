version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/connecting_dots.db:/app/connecting_dots.db
    environment:
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./connecting_dots.db
      - MODEL_SERVICE_URL=http://model-service:8080
      - WEB_CONCURRENCY=1
    restart: unless-stopped

  model-service:
    build:
      context: ./backend/model_service
    ports:
      - "8001:8080"
    environment:
      - LOAD_REAL_FACE_MODEL=false
      - WEB_CONCURRENCY=1
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
